---
name: Build and trigger Antithesis exploration

on:
  # pull_request:
  #   branches: [main]
  schedule:
    - cron: "0 0 * * *" # run every day at midnight
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which setup to test'
        required: true
        default: 'docker'
        type: choice
        options:
          - docker
          - k8s
      duration:
        description: 'Duration (exploration minutes)'
        required: true
        type: number
      description:
        description: 'Description (avoid quotes, please!)'
        required: true
        type: string
      etcd_ref:
        description: 'etcd version to build etcd-server from'
        required: false
        type: string
      email:
        description: 'Additional email notification recipient (separate with ;)'
        required: true
        type: string

# Declare default permissions as read only.
permissions: read-all

env:
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: molten-verve-216720/linuxfoundation-repository

jobs:
  # manual run tests exactly one setup; the nightly schedule runs both
  configure:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Select environment
        id: matrix
        env:
          SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'all' }}
        run: |
          all='[
            {"environment":"k8s","notebook_name":"etcd_k8s"},
            {"environment":"docker","notebook_name":"etcd"}
          ]'
          if [ "$SELECTION" = "all" ]; then
            include=$(printf '%s' "$all" | jq -c '.')
          else
            include=$(printf '%s' "$all" | jq -c --arg s "$SELECTION" '[.[] | select(.environment == $s)]')
          fi
          echo "Selected: $include"
          echo "include=$include" >> "$GITHUB_OUTPUT"

  build-and-push:
    runs-on: ubuntu-latest
    environment: Antithesis
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compute image tag
        id: vars
        env:
          ETCD_REF: ${{ inputs.etcd_ref }}
          SHA: ${{ github.sha }}
        run: |
          if [[ -n "$ETCD_REF" && ! "$ETCD_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Invalid etcd_ref '$ETCD_REF': only alphanumeric characters, '.', '_', '-', and '/' are allowed"
            exit 1
          fi
          echo "image_tag=${ETCD_REF:-main}_${SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to Antithesis Docker Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: _json_key
          password: ${{ secrets.ANTITHESIS_CONTAINER_REGISTRY_TOKEN }}

      - name: Build and push client image
        working-directory: ./tests/antithesis
        run: |
          make antithesis-build-client-image
          IMAGE="${{ env.REGISTRY }}/${{ env.REPOSITORY }}/etcd-client:${{ steps.vars.outputs.image_tag }}"
          docker tag etcd-client:latest "$IMAGE"
          docker push "$IMAGE"

      - name: Build and push etcd image
        working-directory: ./tests/antithesis
        run: |
          make antithesis-build-etcd-image REF=${{ inputs.etcd_ref || 'main' }}
          IMAGE="${{ env.REGISTRY }}/${{ env.REPOSITORY }}/etcd-server:${{ steps.vars.outputs.image_tag }}"
          docker tag etcd-server:latest "$IMAGE"
          docker push "$IMAGE"

      # each setup has its own config image. k8s expects manifests. docker expects a docker-compose
      - name: Build and push docker config image
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.environment == 'docker' }}
        working-directory: ./tests/antithesis
        run: |
          make antithesis-build-docker-config-image IMAGE_TAG=${{ steps.vars.outputs.image_tag }}
          IMAGE="${{ env.REGISTRY }}/${{ env.REPOSITORY }}/etcd-config:docker-${{ steps.vars.outputs.image_tag }}"
          docker tag etcd-config:latest "$IMAGE"
          docker push "$IMAGE"

      - name: Build and push k8s config image
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.environment == 'k8s' }}
        working-directory: ./tests/antithesis
        run: |
          make antithesis-build-k8s-config-image IMAGE_TAG=${{ steps.vars.outputs.image_tag }}
          IMAGE="${{ env.REGISTRY }}/${{ env.REPOSITORY }}/etcd-config:k8s-${{ steps.vars.outputs.image_tag }}"
          docker tag etcd-config:latest "$IMAGE"
          docker push "$IMAGE"

  trigger:
    needs: [configure, build-and-push]
    runs-on: ubuntu-latest
    environment: Antithesis
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.configure.outputs.include) }}
    steps:
      - name: Run Antithesis Test (${{ matrix.environment }})
        uses: antithesishq/antithesis-trigger-action@f6221e2ba819fe0ac3e36bd67a281fa439a03fba # v0.10
        with:
          notebook_name: ${{ matrix.notebook_name }}
          tenant: linuxfoundation
          username: ${{ secrets.ANTITHESIS_WEBHOOK_USERNAME }}
          password: ${{ secrets.ANTITHESIS_WEBHOOK_PASSWORD }}
          github_token: ${{ secrets.GH_PAT }}
          config_image: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/etcd-config:${{ matrix.environment }}-${{ needs.build-and-push.outputs.image_tag }}
          images: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/etcd-client:${{ needs.build-and-push.outputs.image_tag }};${{ env.REGISTRY }}/${{ env.REPOSITORY }}/etcd-server:${{ needs.build-and-push.outputs.image_tag }};docker.io/library/ubuntu:latest
          description: ${{ inputs.description || 'etcd nightly antithesis run' }}
          email_recipients: ${{ inputs.email || 'siarkowicz@google.com' }}
          test_name: ${{ matrix.environment }}
          additional_parameters: |-
            antithesis.duration = ${{ inputs.duration || 360 }}
            antithesis.source = ${{ inputs.etcd_ref || 'main' }}
